name: Mise à jour des actus

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte des sources
        run: python scripts/collect.py

      - name: Publication des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --staged --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "chore: mise à jour des actus $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
