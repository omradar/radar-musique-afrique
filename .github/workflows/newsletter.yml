name: Newsletter du jeudi

# GitHub Actions travaille en UTC. 18h à Paris = 16h UTC en été, 17h UTC en hiver.
# Les deux horaires sont déclarés. Le script ne s'exécute qu'à partir de 18h heure de Paris
# et ne régénère jamais une édition déjà publiée.
on:
  schedule:
    - cron: "0 16 * * 4"
    - cron: "0 17 * * 4"
  workflow_dispatch:   # lancement manuel : génère tout de suite

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rédaction de la newsletter (IA gratuite ou API Claude)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/newsletter.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/newsletters docs/data
          if git diff --staged --quiet; then
            echo "Rien à publier."
          else
            git commit -m "chore: newsletter $(date -u +'%Y-%m-%d')"
            git pull --rebase
            git push
          fi
