# ---------- Google Actualités (flux de recherche) : le filet pour tout ce qui n'a pas de flux ----------
google_news:
  - {id: gn-afrique-musique-fr, query: "musique africaine industrie", hl: fr, gl: SN, ceid: "SN:fr"}
  - {id: gn-afrique-business-fr, query: "musique africaine (streaming OR business OR \"droits d'auteur\")", hl: fr, gl: FR, ceid: "FR:fr"}
  - {id: gn-sn-fr, query: "musique Sénégal mbalax concert", hl: fr, gl: SN, ceid: "SN:fr"}
  - {id: gn-ci-fr, query: "musique (\"Côte d'Ivoire\" OR coupé-décalé)", hl: fr, gl: CI, ceid: "CI:fr"}
  - {id: gn-cm-fr, query: "musique (Cameroun OR Congo OR RDC OR Gabon)", hl: fr, gl: CM, ceid: "CM:fr"}
  - {id: gn-maghreb-fr, query: "musique (Maroc OR Algérie OR Tunisie)", hl: fr, gl: MA, ceid: "MA:fr"}
  - {id: gn-diaspora-fr, query: "(afrobeats OR amapiano) (concert OR festival)", hl: fr, gl: FR, ceid: "FR:fr"}
