# ---------- Filtres : ne garder que les actualités africaines et musicales ----------
# Trois portes dans scripts/collect.py, appliquées à chaque article (et à l'historique à chaque passage) :
#   1. pas de spam : titres trop courts, pages de commentaires, motifs de blocked_title_patterns
#   2. musique : un mot de music_keywords, ou un mot ambigu (festival, label...) sans signal non musical
#   3. Afrique : un terme de africa_terms, sauf pour les sources marquées africa: true
# Les mots sont cherchés en mots entiers (pluriel en s ou x accepté), sans accent obligatoire : écris les deux formes.
# Le dernier passage écrit data/rejected.json (compteurs et titres rejetés) pour régler ces listes.
filters:
  min_title_chars: 15
  blocked_title_patterns:
    - '^comment on '
    - '^re: '
    - ' - audiomack$'          # pages de profil d'artistes, pas des actualités
    - '^\s*[-–|]'              # titre vide ou réduit au nom du site ("- Afropop Worldwide")
  ambiguous_music_keywords:
    - artiste
    - artist
    - festival
    - label
    - sponsoring
    - sponsorship
    - clip
    - tamasha
    - msanii
    - espetáculo
  non_music_terms:             # annulent un mot ambigu (jamais un mot musical fort)
    - fifa
    - world cup
    - coupe du monde
    - football
    - soccer
    - basketball
    - tennis
    - rugby
