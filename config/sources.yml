# Sources du site. Issues du tri de la liste de Kalz (21 octobre 2026).
#
# Champs d'une source :
#   id, name, homepage   : identité
#   feed                 : URL du flux RSS (optionnel, sinon autodécouverte depuis la page d'accueil)
#   lang                 : fr ou en (langue des articles)
#   tier                 : 1 = coeur, 2 = généraliste filtré, 3 = à recouper
#   kind                 : primary (communiqué, rapport, institution) ou secondary (presse qui relaie)
#   verify               : true = un article venant de cette source seule est marqué "non confirmé"
#   keywords             : true = l'article doit contenir un mot-clé musique pour être gardé
#
# Aucun flux n'a été vérifié à l'écriture de ce fichier. La page "Sources" du site
# affiche l'état réel de chaque source après le premier passage du collecteur.

settings:
  max_items_per_feed: 40    # articles lus par flux
  max_age_days: 90          # fraîcheur maximale gardée sur le site
  timeout: 15               # secondes par requête
  workers: 8
  # Éditeurs rencontrés via Google News ou Bing qui doivent être marqués "à recouper"
  verify_publishers: [techlabari, senego, seneweb]

