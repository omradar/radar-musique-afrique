<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Musique Afrique</title>
  <meta name="description" content="Actus, business et industrie de la musique africaine, mises à jour toutes les 6 heures.">
  <meta name="theme-color" content="#F5F2EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1 id="title"></h1>
        <p id="tagline" class="tagline"></p>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="fr">FR</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
    <nav class="wrap tabs">
      <button data-tab="news"></button>
      <button data-tab="newsletters"></button>
      <button data-tab="sources"></button>
    </nav>
  </header>

  <div id="ticker" class="ticker" hidden>
    <div class="wrap ticker-in">
      <span class="ticker-label"><span class="ping" aria-hidden="true"></span><span id="ticker-label"></span></span>
      <ul id="ticker-list"></ul>
    </div>
  </div>

  <main class="wrap">
    <section id="tab-news">
      <div class="filters">
        <input id="f-search" type="search">
        <select id="f-category"></select>
        <select id="f-lang"></select>
        <select id="f-kind"></select>
        <select id="f-period"></select>
        <label class="check"><input id="f-hide" type="checkbox"> <span id="l-hide"></span></label>
      </div>
      <p id="count" class="muted"></p>
      <div id="list"></div>
      <button id="more" class="more" hidden></button>
    </section>

    <section id="tab-newsletters" hidden>
      <div id="nl-list"></div>
    </section>

    <section id="tab-sources" hidden>
      <p id="src-intro" class="muted"></p>
      <div id="src-list"></div>
    </section>
  </main>

  <footer class="wrap foot" id="footer"></footer>
  <script src="app.js"></script>
</body>
</html>
